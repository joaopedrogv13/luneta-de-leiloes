# ITBI (transações reais) das prefeituras para a referência de preço do m² no site (base/fontes/itbi/README.md).
#
# SÓ RODA QUANDO ACIONADO (workflow_dispatch: botão "Run workflow" ou `gh workflow run base-itbi.yml`).
# Lê só dados abertos publicados pelas prefeituras; não faz commit nem usa segredo. O resultado (agregados
# por cidade, bairro e rua, sem nenhum dado pessoal) é publicado no branch `coletas-dados` (pasta itbi/);
# quem integra copia para base/saida/site/.
name: Base - ITBI

on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "explorar (descobrir os arquivos), sp, ou tudo"
        required: false
        default: "tudo"
        type: string

permissions:
  contents: write

jobs:
  itbi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: base/fontes/itbi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install --quiet dadosimob pandas numpy requests openpyxl odfpy
      - run: mkdir -p saida
      - name: Explorar os portais
        if: inputs.etapa != 'sp'
        continue-on-error: true
        run: python explorar.py saida/explorar.json 2>&1 | tee saida/log-explorar.txt
      - name: São Paulo (dadosimob)
        if: inputs.etapa != 'explorar'
        continue-on-error: true
        run: python sp.py saida/itbi-sp.json 2>&1 | tee saida/log-sp.txt
      - name: Publicar o resultado no branch coletas-dados
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PASTA="$RUNNER_TEMP/publicar"
          rm -rf "$PASTA" && mkdir -p "$PASTA"
          cd "$PASTA"
          git init -q && git checkout -q -b coletas-dados
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin coletas-dados 2>/dev/null; then git checkout -q -B coletas-dados FETCH_HEAD; fi
          mkdir -p itbi
          cp "$GITHUB_WORKSPACE"/base/fontes/itbi/saida/* itbi/
          git add -A
          git -c user.name="luneta-coleta" -c user.email="actions@users.noreply.github.com" commit -q -m "ITBI (execução ${{ github.run_id }})" || echo "nada novo"
          for i in 1 2 3; do git push -q origin coletas-dados && break; git fetch -q origin coletas-dados && git rebase -q FETCH_HEAD; done
